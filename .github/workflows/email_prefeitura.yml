name: Email Prefeitura

on:
  workflow_run:
    workflows: ["Conecta"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  packages: read      # necessário para o job puxar a imagem do GHCR

jobs:
  email-prefeitura:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bragada/conecta:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    # Só envia se a "Conecta" terminou com sucesso na janela das 11h UTC.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      contains(github.event.workflow_run.updated_at, 'T11:')

    steps:
      - name: Configurar repositório
        uses: actions/checkout@v4

      - name: Definir variáveis de ambiente (.Renviron)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          TZ: ${{ secrets.TZ }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          USERNAME_RIB: ${{ secrets.USERNAME_RIB }}
          PASSWORD_RIB: ${{ secrets.PASSWORD_RIB }}
          GMAIL_AUTH: ${{ secrets.GMAIL_AUTH }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          GSHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GSHEETS_SERVICE_ACCOUNT_JSON }}
          GDRIVE_AUTH: ${{ secrets.GDRIVE_AUTH }}
          API_RESEND: ${{ secrets.API_RESEND }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
        run: |
          {
            echo "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}"
            echo "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}"
            echo "AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}"
            echo "TZ=${TZ}"
            echo "USERNAME=${USERNAME}"
            echo "PASSWORD=${PASSWORD}"
            echo "USERNAME_RIB=${USERNAME_RIB}"
            echo "PASSWORD_RIB=${PASSWORD_RIB}"
            echo "GMAIL_AUTH=${GMAIL_AUTH}"
            echo "SMTP_USER=${SMTP_USER}"
            echo "SMTP_PASS=${SMTP_PASS}"
            echo "GSHEETS_SERVICE_ACCOUNT_JSON=${GSHEETS_SERVICE_ACCOUNT_JSON}"
            echo "GDRIVE_AUTH=${GDRIVE_AUTH}"
            echo "API_RESEND=${API_RESEND}"
            echo "EMAIL_USER=${EMAIL_USER}"
          } >> .Renviron

      - name: Salvar chaves de serviço (sa.json / sa_drive.json)
        env:
          GSHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GSHEETS_SERVICE_ACCOUNT_JSON }}
          GDRIVE_AUTH: ${{ secrets.GDRIVE_AUTH }}
        # printf '%s' NAO interpreta os \n dentro da private_key (echo, em alguns
        # shells, quebraria o JSON). Assim o sa.json sai identico ao secret.
        run: |
          printf '%s' "$GSHEETS_SERVICE_ACCOUNT_JSON" > sa.json
          printf '%s' "$GDRIVE_AUTH" > sa_drive.json

      - name: Rodar script email_prefeitura.R
        run: Rscript email_prefeitura.R
        env:
          GSHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GSHEETS_SERVICE_ACCOUNT_JSON }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          API_RESEND: ${{ secrets.API_RESEND }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
