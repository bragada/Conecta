name: Build image

# Builda a imagem Docker com TODOS os pacotes R e publica no GitHub Container Registry (GHCR).
# Roda só quando o Dockerfile muda (ou manualmente) -> o custo de instalar pacotes é pago 1x,
# e não a cada execução horária.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - '.github/workflows/build-image.yml'

concurrency:
  group: build-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/conecta:latest
          # Cache de camadas entre builds -> rebuilds ficam rápidos.
          cache-from: type=gha
          cache-to: type=gha,mode=max
