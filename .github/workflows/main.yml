name: Conecta

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read
  packages: read      # necessário para o job puxar a imagem do GHCR

jobs:
  run-scripts:
    runs-on: ubuntu-latest
    # Roda tudo DENTRO da imagem que já tem R + todos os pacotes instalados.
    # Sem apt-get, sem install.packages, sem cache -> só puxar a imagem (segundos) e rodar.
    container:
      image: ghcr.io/bragada/conecta:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        script:
          - email_prefeitura.R
          - campinas.R
          - analitico_atendimentos.R
          - base_hist_oc_rec.R
          - update_mod_prisma.R
    steps:
      - name: Configurar repositório
        uses: actions/checkout@v4

      - name: Definir variáveis de ambiente (.Renviron)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          TZ: ${{ secrets.TZ }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          USERNAME_RIB: ${{ secrets.USERNAME_RIB }}
          PASSWORD_RIB: ${{ secrets.PASSWORD_RIB }}
          GMAIL_AUTH: ${{ secrets.GMAIL_AUTH }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          GSHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GSHEETS_SERVICE_ACCOUNT_JSON }}
        # Escreve na pasta do checkout (cwd). O R lê ".Renviron" do diretório atual,
        # o que é mais robusto dentro de container do que depender do HOME.
        run: |
          {
            echo "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}"
            echo "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}"
            echo "AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}"
            echo "TZ=${TZ}"
            echo "USERNAME=${USERNAME}"
            echo "PASSWORD=${PASSWORD}"
            echo "USERNAME_RIB=${USERNAME_RIB}"
            echo "PASSWORD_RIB=${PASSWORD_RIB}"
            echo "GMAIL_AUTH=${GMAIL_AUTH}"
            echo "SMTP_USER=${SMTP_USER}"
            echo "SMTP_PASS=${SMTP_PASS}"
            echo "GSHEETS_SERVICE_ACCOUNT_JSON=${GSHEETS_SERVICE_ACCOUNT_JSON}"
          } >> .Renviron

      - name: Salvar chaves de serviço (sa.json / sa_gmail.json)
        env:
          GSHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GSHEETS_SERVICE_ACCOUNT_JSON }}
          GMAIL_AUTH: ${{ secrets.GMAIL_AUTH }}
        run: |
          echo "${GSHEETS_SERVICE_ACCOUNT_JSON}" > sa.json
          echo "${GMAIL_AUTH}" > sa_gmail.json

      - name: (DIAGNOSTICO TEMPORARIO) Conferir o que ha no sa.json
        run: |
          Rscript -e 'tryCatch({j <- jsonlite::fromJSON("sa.json"); cat("type        :", if (is.null(j$type)) "<AUSENTE>" else j$type, "\n"); cat("client_email:", if (is.null(j$client_email)) "<AUSENTE>" else j$client_email, "\n"); cat("project_id  :", if (is.null(j$project_id)) "<AUSENTE>" else j$project_id, "\n"); cat("private_key :", if (is.null(j$private_key)) "<AUSENTE>" else "presente", "\n"); cat("primeiras chaves:", paste(head(names(j),6), collapse=", "), "\n")}, error=function(e) cat("ERRO ao ler sa.json como JSON:", conditionMessage(e), "\n"))'

      - name: Rodar script ${{ matrix.script }}
        run: Rscript ${{ matrix.script }}
        env:
          GSHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GSHEETS_SERVICE_ACCOUNT_JSON }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          GMAIL_AUTH: ${{ secrets.GMAIL_AUTH }}
